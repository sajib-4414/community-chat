name: Testing the code
on:
  push:
    branches:
      - release
jobs:
    build-backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Installing dependencies
              run: |
                cd backend
                npm ci
            - name: Build backend
              run: |
                echo "switching to backend directory"
                cd backend
                npm run build
            - name: Set up Docker Compose
              run: sudo apt-get install docker-compose -y
            - name: Start services with Docker Compose
              run: docker-compose -f ./docker-compose.base.yml up -d --build
            - name: Run tests in Node.js container
              run: docker-compose -f docker-compose.base.yml exec -T backend npm run test
            - name: Stop and remove containers
              if: success() || failure()
              run: docker-compose -f docker-compose.base.yml down
            