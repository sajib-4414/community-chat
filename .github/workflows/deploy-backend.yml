name: Testing the code
on:
  push:
    branches:
      - release
    paths:
      - 'backend/**'  # Trigger when any file in the backend folder is changed
jobs:
    build-test-backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Installing dependencies
              run: |
                cd backend
                npm ci
            - name: Build backend
              run: |
                echo "switching to backend directory"
                cd backend
                npm run build
            - name: Set up Docker Compose
              run: sudo apt-get install docker-compose -y
            - name: Start services with Docker Compose
              run: docker-compose -f ./docker-compose.base.yml up -d --build
            - name: Run tests backend
              run: docker-compose -f docker-compose.base.yml exec -T backend npm run test
            - name: Stop and remove containers
              if: success() || failure()
              run: docker-compose -f docker-compose.base.yml down
    
    # this job runs only if the build backend fullly passes
    deploy-backend:
      needs: build-test-backend
      runs-on: ubuntu-latest
      environment: test
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN  }}
        - name: Extract metadata (tags, labels) for Docker
          id: meta
          uses: docker/metadata-action@v5
          env:
            DOCKERHUB_NAMESPACE: 'shamsul070'
            IMAGE_NAME: 'chat-backend'
          with:
            images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
        - name: Build and push
          uses: docker/build-push-action@v6
          with:
            context: backend
            file: backend/Dockerfile.production
            push: ${{ github.event_name != 'pull_request' }}
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
        - name: executing remote ssh commands using password
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.VM_HOST }}
            username: ${{ secrets.VM_USERNAME }}
            password: ${{ secrets.VM_PASSWORD }}
            port: ${{ secrets.SSH_PORT }}
            script: |
              cd /community-chat
              git pull
              sudo docker compose -f docker-compose.prod.yml pull backend
              sudo docker compose -f docker-compose.prod.yml up --build backend