name: Testing the code
on:
  push:
    branches:
      - release
    paths:
      - 'frontend/**'  # Trigger when any file in the frontend folder is changed
jobs:
    build-frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Installing dependencies
              run: |
                cd frontend
                npm ci
            - name: Build frontend
              run: |
                echo "switching to frontend directory"
                cd frontend
                npm run build
    
    # this job runs only if the build frontend fullly passes
    deploy-frontend:
      needs: build-frontend
      runs-on: ubuntu-latest
      environment: test
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN  }}
        - name: Extract metadata (tags, labels) for Docker
          id: meta
          uses: docker/metadata-action@v5
          env:
            DOCKERHUB_NAMESPACE: 'shamsul070'
            IMAGE_NAME: 'chat-frontend'
          with:
            images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
        - name: Build and push
          uses: docker/build-push-action@v6
          with:
            context: frontend
            push: ${{ github.event_name != 'pull_request' }}
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}