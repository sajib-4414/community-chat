name: Testing the code
on: 
  push:
    branches:
      - release
  workflow_dispatch:
  
jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Installing dependencies
        run: |
          cd frontend
          npm ci
      - name: Build frontend
        run: |
          echo "switching to frontend directory"
          cd frontend
          npm run build


  build-backend:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Installing dependencies
        run: |
          cd backend
          npm ci
      - name: Build backend
        run: |
          echo "switching to backend directory"
          cd backend
          npm run build
      - name: Test backend
        run: |
          echo "switching to backend directory"
          cd backend
          npm run test
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          PORT: ${{ secrets.PORT }}
          OPEN_CAGE_API_KEY: ${{ secrets.OPEN_CAGE_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRE: ${{ secrets.JWT_EXPIRE }}
          JWT_COOKIE_EXPIRE: ${{ secrets.JWT_COOKIE_EXPIRE }}
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          ALLOWED_FRONTEND: ${{ secrets.ALLOWED_FRONTEND }}
      


