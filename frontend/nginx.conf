# Define the events block (optional for simple configurations)
events {
    worker_connections 1024;
}

http{

    include /etc/nginx/mime.types;  # Ensure this line is included
    default_type application/octet-stream;

    server {
        listen 8080;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri /index.html;
        }

        # Serve JS files with the correct MIME type
        location ~* \.js$ {
            types { application/javascript js; }
            add_header Content-Type application/javascript;
            try_files $uri =404;
        }

        # only use this if you are serving files from nginx folder. 
        # This condition means -> if there is any file request, serve them from local 
        # so for any file request that should go to microservices, wont be passed. 
        # # Serve other static files from nginx directory
        # location ~* \.(css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|otf)$ {
        #     try_files $uri =404;
        # }


        location /api/ {
            proxy_pass http://backend:3001/api/;  # Adjust to your backend service
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        
        location /sockets {
            proxy_pass http://backend:3001/socket.io;  # Adjust to your backend service
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket-specific headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /uploads/ {
            proxy_pass http://backend:3001/uploads/;  # Proxy requests for /uploads/ to the backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        
    }
}
